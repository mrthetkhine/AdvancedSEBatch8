<html>
    <script>
        function hello()
        {
            console.log('Hello');
        }
        let fun = hello;
        fun();

        function acceptFun(fn)
        {
            console.log('Accepting a function');
            fn();
        }
        acceptFun(hello);
        function handler(e)
        {
            console.log('click ',e);
        }
        document.addEventListener('click',handler);

        setTimeout(hello,3000);
    </script>
</html>
