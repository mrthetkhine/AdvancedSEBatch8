    <script src="https://cdn.jsdelivr.net/npm/ramda@0.31.3/dist/ramda.min.js"></script>
    <script>
        console.log('R.add(1)(2) ',R.add(1)(2));
        console.log('R.add(1,2) ',R.add(1,2));
        
        function add(x,y)
        {
            return x+y;
        }
        let curriedAdd =R.curry(add);
        console.log('curriedAdd(1)(2) ',curriedAdd(1)(2));

        const equals3 = R.equals(3);
        console.log('R.all ',R.all(equals3)([1,2,3]));
        console.log('R.all ',R.all(equals3)([3,3,3]));

        console.log('R.identity ',R.identity(3));
        console.log('R.identity{} ',R.identity({}));

        //a/b
        // x/2 + 5
        console.log('R.pipe ',R.pipe(R.flip(R.divide)(2),R.add(5))(10));
        let obj = {
            name : "Jhon",
            age : 45,
            /*
            address: {
                city:"YGN"
            }*/
        }
        console.log('R.pick ',R.pick(['name','age'])(obj));
        console.log('R.path ',R.path(['address','city'])(obj));
        //obj.address.city = "MDY";
        let obj2 = R.assocPath(['address','city'],'MDY',obj);
        console.log('Obj2 ',obj2);

        let fact = (n)=> R.reduce((a,b)=>a*b,1,R.range(1,n+1));
        console.log('Fact 3 ',fact(3));

        let fact2 = R.pipe(
            R.inc,
            R.range(1),
            R.reduce(R.multiply,1)
        )
        console.log('fact2 3 ',fact2(3));
    </script>
</html>
