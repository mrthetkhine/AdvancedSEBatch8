        function payment(orderId)
        {
            console.log('Payment ',orderId);
        }
        function order()
        {
            console.log('Order');
        }
        function once(fn)
        {
            let done = false;
            return function(...args)
            {
                if(!done)
                {
                    fn(...args);
                    done = true;
                }
            }
        }
        payment = once(payment);
        payment('122');
        payment();

        order=once(order);
        order();
