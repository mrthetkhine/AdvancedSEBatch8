       /*

      const log1 =(message,x)=>console.log(message,x);
      const cLog = R.curry(log1); 
      
      log('X is',10);
      let topK = R.pipe(
        R.countBy(R.identity),
        R.tap(cLog('After group')),

        R.toPairs,
        R.tap(cLog('After pairs')),

        R.sort((a,b)=>b[1]-a[1]),
        R.tap(cLog('After sofrt')),

        R.map(R.head),
        R.tap(cLog('After map')),
        
        R.take(k)
      )
      console.log('topK ',topK(nums));
      const sayX = x => console.log('x is ' + x);
      console.log('tap ',  R.tap(sayX, 100));
